<ion-header>
  <ion-toolbar style="--background: #ff5722; --color: white;">
    <ion-title>👨‍🍳 Panel de Cocina - Polleria Dylan</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content">
  <div class="filter-bar">
    <ion-segment [(ngModel)]="categoriaSeleccionada" (ionChange)="filtrarPedidos()">
      <ion-segment-button value="Todos">Todos</ion-segment-button>
      <ion-segment-button value="Nuevo">Nuevos</ion-segment-button>
      <ion-segment-button value="Preparando">Preparando</ion-segment-button>
      <ion-segment-button value="Listo">Listos</ion-segment-button>
    </ion-segment>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let p of pedidosFiltrados">
        <ion-card class="pedido-card" [ngClass]="p.estado.toLowerCase()">
          <ion-card-header>
            <div class="card-header-flex">
              <ion-card-title>Mesa {{ p.mesa }}</ion-card-title>
              <ion-badge color="medium">{{ p.tiempo }} min</ion-badge>
            </div>
          </ion-card-header>

          <ion-card-content>
            <p><strong>Cliente:</strong> {{ p.clienteNombre }}</p>
            <div class="productos-lista">
              <div class="item" *ngFor="let item of p.productos">
                <span>{{ item.cantidad }}x {{ item.nombre }}</span>
                <ion-note>{{ item.categoria }}</ion-note>
              </div>
            </div>
            <ion-button expand="block" [color]="getColorBtn(p.estado)" (click)="cambiarEstado(p)">
              {{ getLabelBtn(p.estado) }}
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
