<ion-header>
  <ion-toolbar color="warning">
    <ion-title>
      👨‍🍳 Cocina Dylan
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content">

  <div class="welcome-banner">
    <h2>Panel de Cocina</h2>
    <p>Control de preparación de pedidos</p>
  </div>

  <div class="stats-grid">

    <ion-card class="card nuevos">
      <ion-card-content>
        <h3>📥 Nuevos</h3>
        <h1>{{ pedidosNuevos }}</h1>
      </ion-card-content>
    </ion-card>

    <ion-card class="card preparando">
      <ion-card-content>
        <h3>🔥 Preparando</h3>
        <h1>{{ pedidosPreparando }}</h1>
      </ion-card-content>
    </ion-card>

    <ion-card class="card listos">
      <ion-card-content>
        <h3>✅ Listos</h3>
        <h1>{{ pedidosListos }}</h1>
      </ion-card-content>
    </ion-card>

    <ion-card class="card tiempo">
      <ion-card-content>
        <h3>⏱️ Promedio</h3>
        <h1>18m</h1>
      </ion-card-content>
    </ion-card>

  </div>

  <ion-card *ngFor="let pedido of pedidos" class="pedido-card">

    <ion-card-header>

      <ion-card-title>
        🍽️ {{ pedido.mesa }}
      </ion-card-title>

    </ion-card-header>

    <ion-card-content>

      <p class="detalle">
        {{ pedido.detalle }}
      </p>

      <div class="estado">
        Estado:
        <strong>{{ pedido.estado }}</strong>
      </div>

      <div class="buttons">

        <ion-button
          color="warning"
          size="small">

          🔥 Preparando

        </ion-button>

        <ion-button
          color="success"
          size="small">

          ✅ Listo

        </ion-button>

      </div>

    </ion-card-content>

  </ion-card>

</ion-content>
