<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>

  <ion-toolbar class="tabs-toolbar">
    <ion-segment value="general">
      <ion-segment-button value="general"><ion-label>General</ion-label></ion-segment-button>
      <ion-segment-button value="horarios"><ion-label>Horarios</ion-label></ion-segment-button>
      <ion-segment-button value="impresion"><ion-label>Impresión</ion-label></ion-segment-button>
      <ion-segment-button value="pagos"><ion-label>Pagos</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="settings-container">
    <div class="section-title">Datos del restaurante</div>
    <div class="input-group">
      <div class="input-wrapper"><label>Nombre del negocio</label><input type="text" [(ngModel)]="config.nombreEmpresa"></div>
      <div class="input-wrapper"><label>RUC</label><input type="text" [(ngModel)]="config.ruc"></div>
      <div class="input-wrapper"><label>Dirección</label><input type="text" [(ngModel)]="config.direccion"></div>
      <div class="input-wrapper"><label>Teléfono</label><input type="text" [(ngModel)]="config.telefono"></div>
    </div>

    <div class="section-title">Configuración fiscal</div>
    <div class="input-group">
      <div class="input-wrapper"><label>Moneda</label><input type="text" [(ngModel)]="config.moneda"></div>
    </div>

    <div class="footer-actions">
      <ion-button (click)="guardarConfiguracion()" [disabled]="guardando">
        <ion-icon slot="start" name="save"></ion-icon>
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </ion-button>
    </div>
  </div>
</ion-content>
