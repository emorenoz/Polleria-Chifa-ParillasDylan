<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>

    <ion-title>Categorías de la Carta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ editando ? 'Modificar Categoría' : 'Nueva Categoría' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">

        <ion-item class="form-item">
          <ion-input label="Nombre de la Categoría" labelPlacement="stacked" type="text" placeholder="Ej. Pollos a la Brasa, Bebidas, Postres" [(ngModel)]="nuevaCategoria.nombre"></ion-input>
        </ion-item>

        <ion-item class="form-item last-item">
          <ion-input label="Icono / Emoji Representativo" labelPlacement="stacked" type="text" placeholder="Ej. 🍗, 🥤, 🍜" [(ngModel)]="nuevaCategoria.emoji"></ion-input>
        </ion-item>

      </ion-list>

      <div class="ion-padding-top">
        <ion-button expand="block" (click)="guardarCategoria()" [disabled]="!nuevaCategoria.nombre.trim() || !nuevaCategoria.emoji.trim()">
          {{ editando ? 'Actualizar Categoría' : 'Registrar Categoría' }}
        </ion-button>
        <ion-button *ngIf="editando" expand="block" color="light" (click)="cancelarEdicion()" class="ion-margin-top">
          Cancelar Edición
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <h3>Categorías Configuradas</h3>

  <ion-list lines="inset">
    <ion-item-sliding *ngFor="let cat of listaCategorias">
      <ion-item>
        <ion-label slot="start" style="font-size: 24px; margin-right: 10px;">
          {{ cat.emoji }}
        </ion-label>
        <ion-label>
          <h2><strong>{{ cat.nombre }}</strong></h2>
          <p>ID: {{ cat.id }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning" (click)="seleccionarCategoria(cat)">
          <ion-icon slot="icon-only" name="create"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="eliminarCategoria(cat.id)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="listaCategorias.length === 0" class="ion-text-center">
      <ion-label color="medium">No hay categorías registradas en el sistema.</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
