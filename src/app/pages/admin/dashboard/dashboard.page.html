<ion-menu content-id="main-content">

  <ion-header>
    <ion-toolbar color="dark">
      <ion-title>FoodPOS Admin</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>

    <ion-list>

      <ion-item button routerLink="/admin-dashboard">
        🏠 Dashboard
      </ion-item>

      <ion-item button routerLink="/productos">
        📦 Productos
      </ion-item>

      <ion-item button routerLink="/categorias">
        📂 Categorías
      </ion-item>

      <ion-item button routerLink="/pedidos">
        📋 Pedidos
      </ion-item>

      <ion-item button routerLink="/mesas">
        🍽️ Mesas
      </ion-item>

      <ion-item button routerLink="/stock">
        📦 Stock
      </ion-item>

      <ion-item button routerLink="/ventas">
        💰 Ventas
      </ion-item>

      <ion-item button routerLink="/caja">
        💵 Caja
      </ion-item>

      <ion-item button routerLink="/clientes">
        👥 Clientes
      </ion-item>

      <ion-item button routerLink="/usuarios">
        👤 Usuarios
      </ion-item>

      <ion-item button routerLink="/reportes">
        📈 Reportes
      </ion-item>

      <ion-item button routerLink="/configuracion">
        ⚙️ Configuración
      </ion-item>

      <ion-item
        button
        color="danger"
        (click)="cerrarSesion()">

        🚪 Cerrar Sesión

      </ion-item>

    </ion-list>

  </ion-content>

</ion-menu>

<div class="ion-page" id="main-content">

  <ion-header>

    <ion-toolbar color="dark">

      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>
        Dashboard Administrador
      </ion-title>

    </ion-toolbar>

  </ion-header>

  <ion-content class="ion-padding">

    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Ventas del Día
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        S/ {{ ventasDia }}
      </ion-card-content>

    </ion-card>

    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Pedidos Activos
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        {{ pedidosActivos }}
      </ion-card-content>

    </ion-card>

  </ion-content>

</div>
