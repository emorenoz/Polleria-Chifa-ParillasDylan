<ion-header>
  <ion-toolbar color="success">
    <ion-title>Cobrar Pedido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Total: S/ {{ total }}</h2>

  <ion-item>
    <ion-label position="floating">Monto recibido</ion-label>
    <ion-input type="number" [(ngModel)]="monto"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="calcularVuelto()">
    Calcular
  </ion-button>

  <h3>Vuelto: S/ {{ vuelto }}</h3>
</ion-content>
