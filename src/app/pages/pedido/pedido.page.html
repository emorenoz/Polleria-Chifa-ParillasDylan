<div class="header-container">
  <div class="brand-bar">
    <div class="brand-title">
      <ion-icon name="restaurant" class="brand-icon"></ion-icon>
      Pollería Dylan
    </div>
    <div class="brand-subtitle">Sistema de Gestión - Comas</div>
  </div>
</div>

<ion-content class="ion-padding-horizontal main-content">

  <div class="section-header">
    <button class="btn-back" (click)="volver()">
      <ion-icon name="arrow-back-outline"></ion-icon> Volver
    </button>
    <h2>Nuevo Pedido</h2>
  </div>

  <div class="custom-card">
    <h3>Datos del Cliente</h3>

    <div class="input-group">
      <input type="text" [(ngModel)]="pedido.cliente.nombre" placeholder="Nombre del cliente" class="custom-input" />
    </div>

    <div class="input-group">
      <input type="tel" [(ngModel)]="pedido.cliente.telefono" placeholder="Teléfono" class="custom-input" />
    </div>

    <div class="delivery-toggle">
      <button [class.active]="pedido.tipoEntrega === 'Recojo'" (click)="setTipoEntrega('Recojo')" class="btn-toggle text-red">
        Recojo
      </button>
      <button [class.active]="pedido.tipoEntrega === 'Delivery'" (click)="setTipoEntrega('Delivery')" class="btn-toggle text-gray">
        Delivery
      </button>
    </div>

    <div class="input-group dynamic-input-group" *ngIf="pedido.tipoEntrega === 'Delivery'">
      <input type="text" [(ngModel)]="pedido.cliente.direccion" placeholder="Dirección de envío" class="custom-input fade-in" />
    </div>

    <button class="btn-submit-order" (click)="registrarPedido()">
      <ion-icon name="checkmark-circle-outline"></ion-icon> Registrar Pedido
    </button>
  </div>

  <div class="custom-card margin-bottom-large">
    <h3>Menú</h3>

    <div class="categories-container">
      <button [class.active]="categoriaSeleccionada === 'Pollos'" (click)="setCategoria('Pollos')" class="category-tab btn-red">
        Pollos
      </button>
      <button [class.active]="categoriaSeleccionada === 'Guarniciones'" (click)="setCategoria('Guarniciones')" class="category-tab btn-gray">
        Acompañamientos
      </button>
      <button [class.active]="categoriaSeleccionada === 'Bebidas'" (click)="setCategoria('Bebidas')" class="category-tab btn-gray">
        Bebidas
      </button>
      <button [class.active]="categoriaSeleccionada === 'Criollos'" (click)="setCategoria('Criollos')" class="category-tab btn-gray">
        Criollos
      </button>
      <button [class.active]="categoriaSeleccionada === 'Chifa'" (click)="setCategoria('Chifa')" class="category-tab btn-gray">
        Chifa
      </button>
    </div>

    <div class="scroll-indicator">
      <ion-icon name="caret-back-outline"></ion-icon>
      <div class="bar-indicator"></div>
      <ion-icon name="caret-forward-outline"></ion-icon>
    </div>

    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="6" *ngFor="let producto of productosFiltrados" class="ion-no-padding">
          <div class="product-item">
            <div class="product-icon-container">
              <span class="food-emoji">🍗</span>
            </div>
            <div class="product-info">
              <p class="product-name">{{ producto.nombre }}</p>
              <p class="product-price">S/ {{ producto.precio.toFixed(2) }}</p>
            </div>

            <div class="quantity-controls" *ngIf="obtenerCantidad(producto) > 0">
              <button (click)="disminuirCantidad(producto)" class="btn-qty">-</button>
              <span class="qty-number">{{ obtenerCantidad(producto) }}</span>
              <button (click)="aumentarCantidad(producto)" class="btn-qty">+</button>
            </div>
            <button class="btn-add-fast" *ngIf="obtenerCantidad(producto) === 0" (click)="aumentarCantidad(producto)">
              + Agregar
            </button>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
