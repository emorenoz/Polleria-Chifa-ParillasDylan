<ion-content fullscreen>

  <div class="logo-container">

    <img
      src="https://i.postimg.cc/Twy2BRvy/logopolleriadylan.png"
      alt="Pollería Dylan">

  </div>

  <ion-card>

    <ion-card-header>

      <ion-card-title>
        💰 Login Cajero
      </ion-card-title>

      <p class="subtitle">
        Sistema de Caja Dylan
      </p>

    </ion-card-header>

    <ion-card-content>

      <ion-item>

        <ion-icon
          name="person-outline"
          slot="start">
        </ion-icon>

        <ion-input
          placeholder="Usuario"
          [(ngModel)]="usuario">
        </ion-input>

      </ion-item>

      <ion-item>

        <ion-icon
          name="lock-closed-outline"
          slot="start">
        </ion-icon>

        <ion-input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password">
        </ion-input>

      </ion-item>

      <ion-button
        expand="block"
        (click)="login()">

        Ingresar al Sistema

      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
