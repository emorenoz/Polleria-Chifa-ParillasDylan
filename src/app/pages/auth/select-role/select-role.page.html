<ion-content [fullscreen]="true" class="role-content">

  <div class="overlay"></div>

  <div class="role-container">

    <!-- TÍTULO -->
    <div class="title-section">

      <img
        src="https://i.ibb.co/6Mpnz0d/logo-dylan.png"
        alt="Logo de Pollería Dylan">

      <h1>Pollería Dylan</h1>

      <p>
        Selecciona el módulo al que deseas ingresar
      </p>

    </div>

    <!-- ROLES -->
    <div class="roles-grid">

      <!-- ADMINISTRADOR -->
      <ion-card
        class="role-card admin-card"
        button
        tabindex="0"
        (click)="irAdmin()"
        (keyup.enter)="irAdmin()">

        <div class="icon-container">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>

        <h2>Administrador</h2>

      </ion-card>

      <!-- CAJERO -->
      <ion-card
        class="role-card cajero-card"
        button
        tabindex="0"
        (click)="irCajero()"
        (keyup.enter)="irCajero()">

        <div class="icon-container">
          <ion-icon name="cash-outline"></ion-icon>
        </div>

        <h2>Cajero</h2>

      </ion-card>

      <!-- MESERO -->
      <ion-card
        class="role-card mesera-card"
        button
        tabindex="0"
        (click)="irMesero()"
        (keyup.enter)="irMesero()">

        <div class="icon-container">
          <ion-icon name="restaurant-outline"></ion-icon>
        </div>

        <h2>Mesero</h2>

      </ion-card>

      <!-- COCINA -->
      <ion-card
        class="role-card cocina-card"
        button
        tabindex="0"
        (click)="irCocina()"
        (keyup.enter)="irCocina()">

        <div class="icon-container">
          <ion-icon name="flame-outline"></ion-icon>
        </div>

        <h2>Cocina</h2>

      </ion-card>

    </div>

  </div>

</ion-content>
