<ion-content class="ion-padding">

  <ion-card>

    <ion-card-header>
      <ion-card-title>
        Login Administrador
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>

        <ion-icon
          name="person-outline"
          slot="start">
        </ion-icon>

        <ion-input
          placeholder="Usuario"
          [(ngModel)]="usuario">
        </ion-input>

      </ion-item>

      <ion-item>

        <ion-icon
          name="lock-closed-outline"
          slot="start">
        </ion-icon>

        <ion-input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password">
        </ion-input>

      </ion-item>

      <br>

      <ion-button
        expand="block"
        (click)="login()">

        Ingresar

      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
